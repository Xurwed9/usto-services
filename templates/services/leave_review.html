{% extends 'accounts/base.html' %}

{% block main %}
<div class="review-container">
    
    <h2 class="review-header">Баҳодиҳӣ ба усто</h2>
    <p class="review-subtitle">Лутфан, фикри худро дар бораи кори усто <strong>{{ order.service.master.username }}</strong> нависед.</p>
    
    <p class="service-label">Хизматрасонӣ:</p>
    <div class="service-display">
        {{ order.service.title }}
    </div>

    {% if error %}
        <div class="error-banner">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Баҳо (Ситораҳо):</label>
            <select name="rating" class="form-select">
                <option value="">-- Интихоб кунед --</option>
                <option value="5">5 Ситора ⭐⭐⭐⭐⭐ (Аъло)</option>
                <option value="4">4 Ситора ⭐⭐⭐⭐ (Хуб)</option>
                <option value="3">3 Ситора ⭐⭐⭐ (Миёна)</option>
                <option value="2">2 {{ order.get_status_display|default:"Ситора" }} ⭐⭐ (Бад)</option>
                <option value="1">1 Ситора ⭐ (Хеле бад)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Фикри шумо (Шарҳ):</label>
            <textarea name="comment" class="form-textarea" rows="5" placeholder="Дар бораи сифати кор, муомила ва нархи усто нависед..."></textarea>
        </div>

        <div class="actions-wrapper">
            <button type="submit" class="btn-submit">
                Фиристодани шарҳ 🚀
            </button>
            <a href="{% url 'my_orders' %}" class="btn-cancel">
                Отказ
            </a>
        </div>
    </form>
</div>
{% endblock %}
