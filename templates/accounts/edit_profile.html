{% extends "accounts/base.html" %}
{% block main %}

<div style="max-width: 600px; margin: 40px auto; padding: 25px; border: 1px solid #e2e8f0; border-radius: 12px; background: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-family: sans-serif;">
    
    <h2 style="margin-top: 0; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 10px;">Edit Profile</h2>

    {% if messages %}
        {% for message in messages %}
            <div style="padding: 10px; background: #fed7d7; color: #9b2c2c; margin-bottom: 15px; border-radius: 6px; font-weight: bold;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        {% csrf_token %}

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">Profile Picture:</label>
            <input type="file" name="photo" accept="image/*" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px;">
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">Username:</label>
            <input type="text" name="username" value="{{ request.user.username }}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;" required>
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">Email:</label>
            <input type="email" name="email" value="{{ request.user.email }}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;" required>
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">Phone Number:</label>
            <input type="text" name="phone" value="{{ request.user.phone }}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;">
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">Age:</label>
            <input type="number" name="age" value="{{ request.user.age|default:'' }}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;">
        </div>

        <div>
            <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">City:</label>
            <input type="text" name="city" value="{{ request.user.profile.city|default:'' }}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;">
        </div>

        {% if request.user.role == 'master' %}
            <div style="border-top: 2px dashed #edf2f7; padding-top: 15px; margin-top: 10px;">
                <h4 style="margin: 0 0 15px 0; color: #319795;">Master Extra Info</h4>
                
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">Experience (in years):</label>
                    <input type="number" name="experience" value="{{ request.user.profile.experience }}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;">
                </div>

                <div>
                    <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #4a5568;">About Me (Bio):</label>
                    <textarea name="bio" rows="4" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px;">{{ request.user.profile.bio|default:'' }}</textarea>
                </div>
            </div>
        {% endif %}

        <div style="display: flex; gap: 15px; margin-top: 15px;">
            <button type="submit" style="flex: 1; background: #319795; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">
                Save Changes
            </button>
            <a href="{% url 'profile' %}" style="flex: 1; text-align: center; background: #718096; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-size: 16px; font-weight: bold;">
                Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}
