{% extends "accounts/base.html" %}
{% block main %}

<div class="form-wrapper">
    <div class="form-container auth-box-width">
        
        <div class="form-header">
            <div class="header-icon-glow">🔐</div>
            <h2 class="form-title">Вуруд ба система</h2>
            <p class="form-subtitle">Барои давом додан маълумоти худро ворид кунед</p>
        </div>

        {% if error %}
            <div class="error-alert">
                <span class="error-icon">⚠️</span>
                <span class="error-text">{{ error }}</span>
            </div>
        {% endif %}

        <form action="{% url 'login' %}" method="post" class="form-grid">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-group-label" for="username">Номи корбарӣ (Username)</label>
                <input type="text" placeholder="Username-ро ворид кунед" name="username" id="username" value="{{ last_username|default:'' }}" required>
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label class="form-group-label" for="password" style="margin-bottom: 0;">Парол (Password)</label>
                    <a href="{% url 'forgot_password' %}" class="auth-helper-link">
                        Паролро фаромӯш кардед? 🔒
                    </a>
                </div>
                
                <div class="password-input-wrapper">
                    <input type="password" placeholder="Пароли худро ворид кунед" name="password" id="password" required>
                    <button type="button" id="togglePassword" class="password-toggle-btn">
                        <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div class="action-buttons-wrapper" style="margin-top: 10px;">
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Вуруд 🚀</span>
                </button>
            </div>
        </form>

        <div class="auth-footer-zone">
            <p class="auth-footer-text">
                Аккаунт надоред? <a href="{% url 'register' %}" class="auth-footer-link">Сабти ном (Sign Up)</a>
            </p>
            <p class="auth-footer-text" style="margin-top: 10px; font-size: 13px;">
                Коди тасдиқ омад? <a href="{% url 'confirm' %}" class="auth-footer-link" style="color: #10b981;">Тасдиқи почта</a>
            </p>
        </div>

    </div>
</div>

<script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        if (type === 'password') {
            eyeIcon.className = 'fa-solid fa-eye-slash';
        } else {
            eyeIcon.className = 'fa-solid fa-eye';
        }
    });
</script>

{% endblock %}
