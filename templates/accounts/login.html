 {% extends "accounts/base.html" %}
{% block main %}

 <h3> Login </h3>
    <form action="" method="post">
        {% csrf_token %}
        <label for="username">Username</label> <br>
        <input type="text" placeholder="enter ur username" name="username" required> <br> <br>
        <label for="password">password</label> <br>
        <input type="password" placeholder="enter ur password" name="password" required> <br> <br>
      
        <button type="submit"> Login</button>
        {% if error %}
            <p style="color: red;">{{error}}</p>
        {% endif %}
    </form>
    <div>
        <p><strong>Dont an account so </strong> <a href="{% url  'register'  %}">Sign Up</a></p>

    </div>
{% endblock  %}
