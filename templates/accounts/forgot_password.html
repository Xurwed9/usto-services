{% extends 'accounts/base.html' %}
{% block main %}

<div class="form-wrapper">
    <div class="form-container auth-box-width">
        
        <div class="form-header">
            <div class="header-icon-glow">🔒</div>
            <h2 class="form-title">Барқарорсозии Парол</h2>
            <p class="form-subtitle">Почтаи худро ворид кунед, то коди тасдиқро фиристем</p>
        </div>

        {% if error %}
            <div class="error-alert">
                <span class="error-icon">⚠️</span>
                <span class="error-text">{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'forgot_password' %}" class="form-grid">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-group-label" for="email">Почтаи электронӣ (Email)</label>
                <input type="email" name="email" id="email" placeholder="example@mail.com" required>
            </div>
            
            <div class="action-buttons-wrapper" style="margin-top: 15px;">
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Фиристодани Код 🚀</span>
                </button>
            </div>
        </form>

        <div class="auth-footer-zone">
            <p class="auth-footer-text">
                Паролро ба ёд овардед? <a href="{% url 'login' %}" class="auth-footer-link">Ба ақиб (Вуруд)</a>
            </p>
        </div>

    </div>
</div>

{% endblock %}
