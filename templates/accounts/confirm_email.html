 {% extends "accounts/base.html" %}
{% block main %}

 <h3> Confirm Email </h3>
    <form action=" {% url 'confirm' %}" method="post">
        {% csrf_token %}
        <label for="username">Username</label> <br>
        <input value="{{ username }}" type="text" placeholder="enter ur username" name="username" required> <br> <br>
        
        <label for="code">Code</label> <br>
        <input type="text" placeholder="Enter 6-digit code " name="code" required> <br> <br>
        <button type="submit"> Confimr</button>
        {% if error %}
            <p style="color: red;">{{error}}</p>
        {% endif %}
    </form>
    <div>
        <p><strong>Do u already have an account so </strong> <a href="{% url  'login'  %}">Sign in</a></p>
    </div>
{% endblock  %}
