{% extends 'accounts/base.html' %}
{% block main %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; font-family: sans-serif;">
    <h3>Тасдиқи Пароли Нав 🔑</h3>
    
    {% if error %}
        <p style="color: red; font-weight: bold;">{{ error }}</p>
    {% endif %}
    
    <form method="POST" action="{% url 'forgot_password_verify' %}">
        {% csrf_token %}
        
        <input type="hidden" name="email" value="{{ user_email }}">
        
        <p>Коди 6-рақамаро аз почта нависед:</p>
        <input type="text" name="code" required style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px;">
        
        <p>Пароли нав:</p>
        <input type="password" name="password1" required style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px;">
        
        <p>Такрори пароли нав:</p>
        <input type="password" name="password2" required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px;">
        
        <button type="submit" style="background: #38a169; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
            Сабти Пароли Нав 💾
        </button>
    </form>
</div>
{% endblock %}
