{% extends 'accounts/base.html' %}
{% block main %}

<div class="form-wrapper">
    <div class="form-container auth-box-width">
        
        <div class="form-header">
            <div class="header-icon-glow">🔑</div>
            <h2 class="form-title">Тасдиқи Пароли Нав</h2>
            <p class="form-subtitle">Коди тасдиқ ва пароли навро ворид кунед</p>
        </div>

        {% if error %}
            <div class="error-alert">
                <span class="error-icon">⚠️</span>
                <span class="error-text">{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'forgot_password_verify' %}" class="form-grid">
            {% csrf_token %}
            
            <input type="hidden" name="email" value="{{ user_email }}">
            
            <div class="form-group">
                <label class="form-group-label" for="code">Коди тасдиқ (аз почта)</label>
                <input type="text" name="code" id="code" placeholder="X X X X X X" maxlength="6" style="text-align: center; font-size: 18px; letter-spacing: 4px; font-weight: bold;" required>
            </div>
            
            <div class="form-group">
                <label class="form-group-label" for="password1">Пароли нав</label>
                <div class="password-input-wrapper">
                    <input type="password" placeholder="Пароли навро ворид кунед" name="password1" id="password1" required>
                    <button type="button" class="password-toggle-btn" data-target="password1">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-group-label" for="password2">Такрори пароли нав</label>
                <div class="password-input-wrapper">
                    <input type="password" placeholder="Паролро такрор кунед" name="password2" id="password2" required>
                    <button type="button" class="password-toggle-btn" data-target="password2">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>
            
            <div class="action-buttons-wrapper" style="margin-top: 15px;">
                <button type="submit" class="btn-submit" style="background: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);">
                    <span class="btn-text">Сабти Пароли Нав 💾</span>
                </button>
            </div>
        </form>

    </div>
</div>

<script>
    document.querySelectorAll('.password-toggle-btn').forEach(button => {
        button.addEventListener('click', function() {
            const inputId = this.getAttribute('data-target');
            const inputField = document.getElementById(inputId);
            const icon = this.querySelector('i');
            
            if (inputField.type === 'password') {
                inputField.type = 'text';
                icon.className = 'fa-solid fa-eye';
            } else {
                inputField.type = 'password';
                icon.className = 'fa-solid fa-eye-slash';
            }
        });
    });
</script>

{% endblock %}
