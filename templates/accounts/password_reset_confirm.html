{% extends 'accounts/base.html' %}
{% block main %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px;">
    <h3>Пароли навро ворид кунед</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #38a169; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px;">Сабти парол</button>
    </form>
</div>
{% endblock %}
